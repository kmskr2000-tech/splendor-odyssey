# Android AAB 빌드 (Odyssey: The Card)
# 실제 빌드 로직은 packaging/android-build.sh 에 있음 (git push로 업데이트 가능)
# 실행: Actions 탭 → "Android AAB" → Run workflow
# 결과: Artifacts에서 app-release.aab 다운로드 → Play Console에 업로드

name: Android AAB

on:
  workflow_dispatch:
    inputs:
      appName:
        description: '앱 이름 (Play 표시명)'
        required: true
        default: 'Odyssey: The Card'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build AAB
        run: bash packaging/android-build.sh "${{ inputs.appName }}"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/debug/*.aab
